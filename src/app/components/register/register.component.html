<div class="login-container">
  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <a routerLink="/" class="back-link">← Volver</a>
    <h2>Registro</h2>
    <div>
      <label for="nombre">Nombre de Usuario:</label>
      <input id="nombre" formControlName="nombre" type="text" required />
    </div>
    <div>
      <label for="email">Gmail:</label>
      <input id="email" formControlName="email" type="email" required />
      <small class="validation-text">Debe ser un correo Gmail válido (ejemplo&#64;gmail.com)</small>
    </div>
    <div>
      <label for="password">Contraseña:</label>
      <div class="password-container">
        <input id="password" formControlName="password" [type]="hidePassword ? 'password' : 'text'" required />
        <button type="button" class="eye-btn" (click)="togglePasswordVisibility()">{{ hidePassword ? '👁️' : '🙈' }}</button>
      </div>
      <small class="validation-text">Mínimo 8 caracteres</small>
    </div>
    <button type="submit" [disabled]="registroForm.invalid">Registrarse</button>
  </form>
</div>

<!-- Modal -->
<div *ngIf="showModal" class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <p>{{ modalMessage }}</p>
    <button (click)="closeModal()">Aceptar</button>
  </div>
</div>
