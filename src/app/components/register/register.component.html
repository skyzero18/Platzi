<a routerLink="/" class="back-link">← Volver a la página principal</a>
<div class="login-container">
  <h2>Registro</h2>
  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="nombre">Nombre de Usuario:</label>
      <input id="nombre" formControlName="nombre" type="text" required />
    </div>
    <div>
      <label for="email">Gmail:</label>
      <input id="email" formControlName="email" type="email" required />
    </div>
    <div>
      <label for="password">Contraseña:</label>
      <input id="password" formControlName="password" type="password" required />
    </div>
    <button type="submit" [disabled]="registroForm.invalid">Registrarse</button>
  </form>
</div>

<!-- Modal -->
<div *ngIf="showModal" class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <p>{{ modalMessage }}</p>
    <button (click)="closeModal()">Aceptar</button>
  </div>
</div>
