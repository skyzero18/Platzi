<header class="header">
  <h1>Platzi Store</h1>
  <div class="header-right">
    <div *ngIf="!isLoggedIn">
      <button class="login-btn" (click)="openModal()">Iniciar Sesión</button>
    </div>
    <div *ngIf="isLoggedIn" class="user-info">
      <span>{{ currentUser?.displayName || currentUser?.email }}</span>
      <button class="logout-btn" (click)="logout()">Cerrar Sesión</button>
      <div class="cart">
        <span class="cart-icon">🛒</span>
        <span class="cart-count">0</span>
      </div>
    </div>
  </div>
</header>

<!-- Modal -->
<div *ngIf="showModal" class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closeModal()">&times;</button>
    <h2>Iniciar Sesión</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()">
      <label for="email">Correo:</label>
      <input id="email" formControlName="email" type="email" required />
      <label for="password">Contraseña:</label>
      <input id="password" formControlName="password" type="password" required />
      <button type="submit" [disabled]="loginForm.invalid">Iniciar Sesión</button>
    </form>
    <a routerLink="/registeruser" (click)="closeModal()">Crear cuenta aquí</a>
  </div>
</div>

<!-- Success Modal -->
<div *ngIf="showSuccessModal" class="modal-overlay" (click)="closeSuccessModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <p>{{ modalMessage }}</p>
    <button (click)="closeSuccessModal()">Aceptar</button>
  </div>
</div>
