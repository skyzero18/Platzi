<div class="search-bar">
  <input
    type="text"
    class="search-input"
    placeholder="Buscar productos..."
    [(ngModel)]="searchTerm"
  />

  <select
    class="category-select"
    [(ngModel)]="selectedCategory"
  >
    <option value="">Todas las categorías</option>
    <option *ngFor="let cat of categorias" [value]="cat.slug">
      {{ cat.name }}
    </option>
  </select>


</div>

<div class="productos">
  <div
    *ngFor="let producto of productosFiltrados"
    class="producto-item"
    (click)="selectProducto(producto)"
  >
    <div class="img-box">
      <img [src]="producto.image" alt="{{ producto.nombre }}" />
    </div>
    <h3>{{ producto.nombre }}</h3>
    <p class="precio">{{ producto.precio | currency }}</p>
  </div>
</div>

<div class="detalle-overlay" *ngIf="selectedProducto" (click)="selectedProducto = null">
  <div class="detalle-producto-grande" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="selectedProducto = null" aria-label="Cerrar">
      &times;
    </button>
    <div class="detalle-img">
      <img [src]="selectedProducto.image" alt="{{ selectedProducto.nombre }}" />
    </div>
    <div class="detalle-info">
      <h3>{{ selectedProducto.nombre }}</h3>
      <p>{{ selectedProducto.descripcion }}</p>
      <p><strong>Categoría:</strong> {{ selectedProducto.categoria }}</p>
      <p><strong>Precio:</strong> {{ selectedProducto.precio | currency }}</p>
      <div *ngIf="authService.isLoggedIn(); else notLoggedIn">
        <div class="quantity-selector">
          <label for="quantity">Cantidad:</label>
          <input type="number" id="quantity" [(ngModel)]="quantity" min="1" max="99" />
        </div>
        <button class="add-to-cart-btn" (click)="addToCart(selectedProducto)" [disabled]="addedToCart">
          <span *ngIf="!addedToCart">🛒 Agregar al Carrito</span>
          <span *ngIf="addedToCart">✅ Agregado</span>
        </button>
      </div>
      <ng-template #notLoggedIn>
        <p>Se requiere iniciar sesión para agregar a tus favoritos.</p>
      </ng-template>
    </div>
  </div>
</div>
